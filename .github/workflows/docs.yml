# Usage from another repo:
#
#   jobs:
#     docs:
#       uses: HailToDodongo/n64-docs/.github/workflows/docs.yml@main
#       permissions:
#         pages: write
#         id-token: write
#       with:
#         docs-dir: docs
#

name: Build and Deploy Docs

on:
  workflow_call:
    inputs:
      docs-dir:
        type: string
        default: docs
      doxygen:
        description: Install Doxygen (needed for the C++ API)
        type: boolean
        default: true
      lfs:
        type: boolean
        default: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.lfs }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Doxygen
        if: inputs.doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.docs-dir }}/requirements.txt

      - name: Build Sphinx HTML
        working-directory: ${{ inputs.docs-dir }}
        run: n64-docs build

      - name: Upload docs artifact for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.docs-dir }}/_build/html

      - name: Upload docs artifact for PRs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: ${{ inputs.docs-dir }}/_build/html

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
